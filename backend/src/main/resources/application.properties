spring.application.name=Web
spring.datasource.url=jdbc:mysql://localhost:3306/vindb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100

logging.level.dsp.backend=DEBUG

airflow.base-url=${AIRFLOW_BASE_URL:http://localhost:8081/api/v1}
airflow.username=${AIRFLOW_USERNAME:admin}
airflow.password=${AIRFLOW_PASSWORD:admin}

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=vin-portfolio-history
spring.kafka.consumer.auto-offset-reset=earliest

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.tags.application=vin-backend
management.metrics.distribution.percentiles-histogram.http.server.requests=true
